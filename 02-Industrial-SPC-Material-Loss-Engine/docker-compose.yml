version: "3.9"
services:
  db:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: spc_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  dashboard:
    build: ./src/dashboard
    ports:
      - "8050:8050"
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://postgres:secure_password@db:5432/spc_db

volumes:
  pgdata:
